<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dự Đoán Tài Xỉu MD5</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
 --tai:#ff3b3b;
 --xiu:#2dff8f;
 --vip-bg:#050507;
 --vip-panel:#0b0b12;
 --vip-line:#1a1a28;
 --vip-glow:#7c7cff;
}

*{
 box-sizing:border-box;
 font-family:'Nunito',sans-serif;
 margin:0;
 padding:0;
 -webkit-tap-highlight-color:transparent;
 touch-action:manipulation;
}

html{
 width:100%;
 height:100%;
 position:fixed;
 overflow:hidden;
 background:#000;
}

body{
 width:100%;
 height:100%;
 position:fixed;
 overflow:hidden;
 background:#000;
 color:#e6e6eb;
 touch-action:pan-x pan-y;
}

#betFrame{
 position:fixed;
 top:0;
 left:0;
 width:100%;
 height:100%;
 border:none;
 z-index:1;
 pointer-events:auto;
}

#floatBox{
 position:fixed;
 top:20px;
 left:20px;
 z-index:99999;
 pointer-events:auto;
 display:none;
}

.tool{
 width:300px;
 max-width:85vw;
 max-height:80vh;
 background:linear-gradient(180deg,#07070d,#0c0c14);
 border-radius:16px;
 padding:12px;
 border:1px solid var(--vip-line);
 box-shadow:0 0 40px rgba(0,0,0,.95);
 overflow-y:auto;
}

.header{
 text-align:center;
 margin-bottom:8px;
 cursor:move;
 user-select:none;
 padding:4px;
}

.header h2{
 margin:0;
 font-size:16px;
 font-weight:800;
 letter-spacing:1px;
 background:linear-gradient(90deg,#666,#fff,#666);
 -webkit-background-clip:text;
 -webkit-text-fill-color:transparent;
}

.prediction{
 margin-bottom:8px;
 padding:10px;
 border-radius:12px;
 background:#07070c;
 border:1px solid var(--vip-line);
 text-align:center;
}

.pred-main{
 font-size:26px;
 font-weight:900;
 text-shadow:0 0 12px currentColor;
}

.pred-main.tai{color:var(--tai)}
.pred-main.xiu{color:var(--xiu)}
.pred-sub{font-size:10px;color:#aaa;margin-top:3px}
.pred-dice{font-size:11px;color:#999;margin-top:5px;font-weight:700}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:5px;
 margin-bottom:8px;
}

.stat{
 background:#07070c;
 border:1px solid var(--vip-line);
 border-radius:8px;
 padding:5px;
 text-align:center;
}

.stat-label{font-size:8px;color:#777}
.stat-value{font-size:13px;font-weight:900;color:#fff}

.input-section{margin-bottom:8px}
.input-section h3{font-size:12px;margin-bottom:5px;color:#aaa}

.dice-input{
 display:flex;
 gap:5px;
 margin-bottom:5px;
}

.input{
 flex:1;
 padding:8px;
 border-radius:8px;
 border:1px solid var(--vip-line);
 background:#000;
 color:#fff;
 font-weight:800;
 text-align:center;
 outline:none;
 font-size:14px;
 pointer-events:auto;
}

.btn{
 width:100%;
 padding:9px;
 border:none;
 border-radius:10px;
 font-weight:900;
 letter-spacing:1px;
 background:linear-gradient(90deg,var(--tai),var(--xiu));
 color:#000;
 cursor:pointer;
 pointer-events:auto;
 font-size:13px;
}

.history{margin-bottom:8px}
.history h3{font-size:12px;margin-bottom:5px;color:#aaa}

.history-list{
 max-height:120px;
 overflow-y:auto;
 background:#07070c;
 border:1px solid var(--vip-line);
 border-radius:8px;
 padding:5px;
}

.history-item{
 display:flex;
 justify-content:space-between;
 padding:4px 5px;
 margin-bottom:2px;
 background:#000;
 border-radius:5px;
 font-size:11px;
}

.history-item .dice{font-weight:800}
.history-item .tai{color:var(--tai);font-weight:900}
.history-item .xiu{color:var(--xiu);font-weight:900}

.btn-clear{
 width:100%;
 padding:6px;
 margin-top:5px;
 border:none;
 border-radius:7px;
 background:#1a1a28;
 color:#fff;
 font-weight:700;
 cursor:pointer;
 pointer-events:auto;
 font-size:11px;
}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#111}
::-webkit-scrollbar-thumb{background:#333;border-radius:4px}

#menuBtn{
 position:fixed;
 bottom:20px;
 right:20px;
 width:54px;
 height:54px;
 border-radius:50%;
 border:2px solid var(--vip-line);
 background:linear-gradient(135deg,#f093fb,#f5576c);
 color:#fff;
 font-size:22px;
 font-weight:900;
 z-index:999999;
 box-shadow:0 0 25px rgba(0,0,0,.9);
 cursor:move;
 pointer-events:auto;
 display:flex;
 align-items:center;
 justify-content:center;
 user-select:none;
}

#menuBtn.dragging{opacity:0.8}

@media(orientation:landscape) and (max-height:500px){
 .tool{width:260px;max-height:85vh;padding:8px}
 .header h2{font-size:14px}
 .pred-main{font-size:22px}
 .stats{gap:4px}
 .stat{padding:4px}
 .stat-value{font-size:11px}
 .history-list{max-height:80px}
 #floatBox{top:10px;left:10px}
 #menuBtn{width:48px;height:48px;font-size:20px}
}

@media(max-width:360px){
 .tool{width:90vw;padding:10px}
 .pred-main{font-size:22px}
 .stat-value{font-size:11px}
}
</style>
</head>
<body>

<iframe id="betFrame" src="https://play.betvip.fit"></iframe>

<div id="floatBox">
 <div class="tool">
  <div class="header" id="dragHandle">
   <h2>🎲 DỰ ĐOÁN TÀI XỈU MD5</h2>
  </div>

  <div class="prediction">
   <div class="pred-main" id="predResult">Chưa có dữ liệu</div>
   <div class="pred-sub" id="predConf"></div>
   <div class="pred-dice" id="predDice"></div>
  </div>

  <div class="stats">
   <div class="stat">
    <div class="stat-label">Tổng</div>
    <div class="stat-value" id="totalGames">0</div>
   </div>
   <div class="stat">
    <div class="stat-label">Tài</div>
    <div class="stat-value" id="taiCount">0</div>
   </div>
   <div class="stat">
    <div class="stat-label">Xỉu</div>
    <div class="stat-value" id="xiuCount">0</div>
   </div>
   <div class="stat">
    <div class="stat-label">Đúng</div>
    <div class="stat-value" id="accuracy">0%</div>
   </div>
  </div>

  <div class="input-section">
   <h3>📝 Nhập Kết Quả</h3>
   <div class="dice-input">
    <input type="number" class="input" id="d1" min="1" max="6" placeholder="1" inputmode="numeric">
    <input type="number" class="input" id="d2" min="1" max="6" placeholder="2" inputmode="numeric">
    <input type="number" class="input" id="d3" min="1" max="6" placeholder="3" inputmode="numeric">
   </div>
   <button class="btn" onclick="addResult()">THÊM</button>
  </div>

  <div class="history">
   <h3>📊 Lịch Sử</h3>
   <div class="history-list" id="historyList">
    <div style="text-align:center;color:#555;padding:12px;font-size:10px">Chưa có lịch sử</div>
   </div>
   <button class="btn-clear" onclick="clearHistory()">Xóa</button>
  </div>
 </div>
</div>

<button id="menuBtn">☰</button>

<script>
// ===== KHÓA MÀN HÌNH NẰM NGANG =====
if (screen.orientation && screen.orientation.lock) {
 screen.orientation.lock('landscape').catch(err => {
  console.log('Orientation lock not supported:', err);
 });
}

// ===== FIX VIEWPORT =====
function setViewportHeight() {
 const vh = window.innerHeight * 0.01;
 document.documentElement.style.setProperty('--vh', `${vh}px`);
 document.body.style.height = window.innerHeight + 'px';
 document.documentElement.style.height = window.innerHeight + 'px';
}

setViewportHeight();
window.addEventListener('resize', setViewportHeight);
window.addEventListener('orientationchange', function() {
 setTimeout(setViewportHeight, 100);
});

// ===== PREVENT SCROLL =====
document.body.addEventListener('touchmove', function(e) {
 if (!e.target.closest('.tool')) {
  e.preventDefault();
 }
}, {passive: false});

// ===== DISABLE DOUBLE TAP ZOOM =====
let lastTouchEnd = 0;
document.addEventListener('touchend', function(e) {
 const now = Date.now();
 if (now - lastTouchEnd <= 300) {
  e.preventDefault();
 }
 lastTouchEnd = now;
}, false);

// ===== DATA =====
let history = JSON.parse(localStorage.getItem('taixiuHistory')) || [];
let lastPrediction = null;
let lastPredictedDice = null;
let correctPredictions = parseInt(localStorage.getItem('correctPredictions')) || 0;
let totalPredictions = parseInt(localStorage.getItem('totalPredictions')) || 0;

// ===== INIT =====
window.onload = function() {
 updateDisplay();
 setViewportHeight();
};

// ===== MENU DRAG =====
let menuBtn = document.getElementById('menuBtn');
let floatBox = document.getElementById('floatBox');
let isMenuDragging = false;
let menuStartX, menuStartY, menuStartLeft, menuStartTop;
let menuHasMoved = false;

menuBtn.addEventListener('mousedown', startMenuDrag);
menuBtn.addEventListener('touchstart', startMenuDrag, {passive: false});

function startMenuDrag(e) {
 isMenuDragging = true;
 menuHasMoved = false;
 const touch = e.touches ? e.touches[0] : e;
 menuStartX = touch.clientX;
 menuStartY = touch.clientY;
 menuStartLeft = menuBtn.offsetLeft;
 menuStartTop = menuBtn.offsetTop;
 menuBtn.classList.add('dragging');
 e.preventDefault();
}

document.addEventListener('mousemove', dragMenu);
document.addEventListener('touchmove', dragMenu, {passive: false});

function dragMenu(e) {
 if (!isMenuDragging) return;
 const touch = e.touches ? e.touches[0] : e;
 const deltaX = touch.clientX - menuStartX;
 const deltaY = touch.clientY - menuStartY;
 
 if (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5) {
  menuHasMoved = true;
 }
 
 let newLeft = menuStartLeft + deltaX;
 let newTop = menuStartTop + deltaY;
 
 newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - menuBtn.offsetWidth));
 newTop = Math.max(0, Math.min(newTop, window.innerHeight - menuBtn.offsetHeight));
 
 menuBtn.style.left = newLeft + 'px';
 menuBtn.style.top = newTop + 'px';
 menuBtn.style.right = 'auto';
 menuBtn.style.bottom = 'auto';
 e.preventDefault();
}

document.addEventListener('mouseup', endMenuDrag);
document.addEventListener('touchend', endMenuDrag);

function endMenuDrag() {
 if (isMenuDragging) {
  menuBtn.classList.remove('dragging');
  if (!menuHasMoved) {
   toggleTool();
  }
  isMenuDragging = false;
 }
}

function toggleTool() {
 floatBox.style.display = floatBox.style.display === 'none' ? 'block' : 'none';
}

// ===== TOOL DRAG =====
let dragHandle = document.getElementById('dragHandle');
let isToolDragging = false;
let toolStartX, toolStartY, toolStartLeft, toolStartTop;

dragHandle.addEventListener('mousedown', startToolDrag);
dragHandle.addEventListener('touchstart', startToolDrag, {passive: false});

function startToolDrag(e) {
 isToolDragging = true;
 const touch = e.touches ? e.touches[0] : e;
 toolStartX = touch.clientX;
 toolStartY = touch.clientY;
 toolStartLeft = floatBox.offsetLeft;
 toolStartTop = floatBox.offsetTop;
 e.preventDefault();
}

document.addEventListener('mousemove', dragTool);
document.addEventListener('touchmove', dragTool, {passive: false});

function dragTool(e) {
 if (!isToolDragging) return;
 const touch = e.touches ? e.touches[0] : e;
 const deltaX = touch.clientX - toolStartX;
 const deltaY = touch.clientY - toolStartY;
 
 let newLeft = toolStartLeft + deltaX;
 let newTop = toolStartTop + deltaY;
 
 newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - floatBox.offsetWidth));
 newTop = Math.max(0, Math.min(newTop, window.innerHeight - floatBox.offsetHeight));
 
 floatBox.style.left = newLeft + 'px';
 floatBox.style.top = newTop + 'px';
 e.preventDefault();
}

document.addEventListener('mouseup', () => isToolDragging = false);
document.addEventListener('touchend', () => isToolDragging = false);

// ===== PREVENT INPUT DRAG =====
const inputs = document.querySelectorAll('.input');
inputs.forEach(input => {
 input.addEventListener('mousedown', e => e.stopPropagation());
 input.addEventListener('touchstart', e => e.stopPropagation());
});

// ===== ADD RESULT =====
function addResult() {
 let d1 = parseInt(document.getElementById('d1').value);
 let d2 = parseInt(document.getElementById('d2').value);
 let d3 = parseInt(document.getElementById('d3').value);

 if (!d1 || !d2 || !d3 || d1 < 1 || d1 > 6 || d2 < 1 || d2 > 6 || d3 < 1 || d3 > 6) {
  alert('Vui lòng nhập đúng giá trị xúc xắc (1-6)!');
  return;
 }

 let sum = d1 + d2 + d3;
 let result = sum >= 11 ? 'TÀI' : 'XỈU';

 // Kiểm tra dự đoán trước
 if (lastPrediction) {
  totalPredictions++;
  if (lastPrediction === result) {
   correctPredictions++;
  }
  localStorage.setItem('correctPredictions', correctPredictions);
  localStorage.setItem('totalPredictions', totalPredictions);
 }

 // Thêm vào lịch sử
 history.unshift({
  dice: [d1, d2, d3],
  sum: sum,
  result: result,
  time: new Date().toLocaleString('vi-VN')
 });

 if (history.length > 500) {
  history = history.slice(0, 500);
 }

 localStorage.setItem('taixiuHistory', JSON.stringify(history));

 document.getElementById('d1').value = '';
 document.getElementById('d2').value = '';
 document.getElementById('d3').value = '';
 document.getElementById('d1').focus();

 updateDisplay();
}

// ===== THUẬT TOÁN DỰ ĐOÁN NÂNG CAO - DỰA TRÊN XÚC XẮC =====
function predictNext() {
 if (history.length < 10) {
  return { 
   prediction: 'Cần ít nhất 10 ván', 
   confidence: 0,
   dice: null
  };
 }

 // Phân tích chi tiết từng viên xúc xắc
 const diceAnalysis = analyzeDicePatterns();
 const sumAnalysis = analyzeSumPatterns();
 const resultAnalysis = analyzeResultPatterns();
 const streakAnalysis = analyzeStreak();
 const frequencyAnalysis = analyzeFrequency();

 // Dự đoán từng viên xúc xắc
 let predictedDice = [
  predictDiceValue(0, diceAnalysis),
  predictDiceValue(1, diceAnalysis),
  predictDiceValue(2, diceAnalysis)
 ];

 let predictedSum = predictedDice[0] + predictedDice[1] + predictedDice[2];
 let prediction = predictedSum >= 11 ? 'TÀI' : 'XỈU';

 // Điều chỉnh dựa trên pattern kết quả
 let taiScore = 0;
 let xiuScore = 0;

 // 1. Dựa trên tổng dự đoán (40%)
 if (prediction === 'TÀI') taiScore += 40;
 else xiuScore += 40;

 // 2. Pattern kết quả (25%)
 if (resultAnalysis.nextResult === 'TÀI') taiScore += 25;
 else if (resultAnalysis.nextResult === 'XỈU') xiuScore += 25;

 // 3. Phá chuỗi (20%)
 if (streakAnalysis.shouldBreak) {
  if (streakAnalysis.current === 'TÀI') xiuScore += 20;
  else taiScore += 20;
 } else {
  if (streakAnalysis.current === 'TÀI') taiScore += 20;
  else xiuScore += 20;
 }

 // 4. Tần suất cân bằng (15%)
 if (frequencyAnalysis.shouldBe === 'TÀI') taiScore += 15;
 else xiuScore += 15;

 // Quyết định cuối cùng
 const finalPrediction = taiScore > xiuScore ? 'TÀI' : 'XỈU';
 
 // Điều chỉnh xúc xắc nếu cần
 if (finalPrediction !== prediction) {
  // Điều chỉnh 1 viên xúc xắc để đổi kết quả
  if (finalPrediction === 'TÀI' && predictedSum < 11) {
   // Tăng viên có giá trị thấp nhất
   let minIdx = predictedDice.indexOf(Math.min(...predictedDice));
   predictedDice[minIdx] = Math.min(6, predictedDice[minIdx] + (11 - predictedSum));
  } else if (finalPrediction === 'XỈU' && predictedSum >= 11) {
   // Giảm viên có giá trị cao nhất
   let maxIdx = predictedDice.indexOf(Math.max(...predictedDice));
   predictedDice[maxIdx] = Math.max(1, predictedDice[maxIdx] - (predictedSum - 10));
  }
  predictedSum = predictedDice[0] + predictedDice[1] + predictedDice[2];
 }

 const confidence = Math.round(Math.max(taiScore, xiuScore));

 lastPrediction = finalPrediction;
 lastPredictedDice = predictedDice;
 
 return { 
  prediction: finalPrediction, 
  confidence: confidence,
  dice: predictedDice,
  sum: predictedSum
 };
}

// Phân tích pattern từng viên xúc xắc
function analyzeDicePatterns() {
 const patterns = [[], [], []]; // 3 viên xúc xắc
 
 for (let i = 0; i < Math.min(history.length, 50); i++) {
  patterns[0].push(history[i].dice[0]);
  patterns[1].push(history[i].dice[1]);
  patterns[2].push(history[i].dice[2]);
 }
 
 return patterns;
}

// Dự đoán giá trị viên xúc xắc
function predictDiceValue(diceIndex, diceAnalysis) {
 const recent = diceAnalysis[diceIndex].slice(0, 10);
 
 // Tìm pattern lặp lại
 const last3 = recent.slice(0, 3);
 for (let i = 3; i < recent.length - 1; i++) {
  if (recent[i] === last3[0] && recent[i+1] === last3[1] && recent[i+2] === last3[2]) {
   if (i > 0) return recent[i-1];
  }
 }
 
 // Tính trung bình có trọng số (gần đây quan trọng hơn)
 let weightedSum = 0;
 let weightTotal = 0;
 for (let i = 0; i < Math.min(recent.length, 10); i++) {
  let weight = 10 - i;
  weightedSum += recent[i] * weight;
  weightTotal += weight;
 }
 
 let avg = Math.round(weightedSum / weightTotal);
 
 // Tránh lặp lại quá nhiều
 if (recent[0] === avg && recent[1] === avg) {
  avg = avg === 6 ? 1 : avg + 1;
 }
 
 return Math.max(1, Math.min(6, avg));
}

// Phân tích pattern tổng
function analyzeSumPatterns() {
 const sums = history.slice(0, 20).map(h => h.sum);
 const avg = sums.reduce((a, b) => a + b, 0) / sums.length;
 
 return { average: avg, trend: avg > 10.5 ? 'HIGH' : 'LOW' };
}

// Phân tích pattern kết quả
function analyzeResultPatterns() {
 if (history.length < 6) return { nextResult: null };
 
 const last3 = history.slice(0, 3).map(h => h.result).join('');
 
 for (let i = 3; i < Math.min(history.length - 1, 50); i++) {
  const pattern = history.slice(i, i + 3).map(h => h.result).join('');
  if (pattern === last3) {
   return { nextResult: history[i - 1].result };
  }
 }
 
 return { nextResult: null };
}

// Phân tích chuỗi
function analyzeStreak() {
 let streak = 1;
 const current = history[0].result;
 
 for (let i = 1; i < history.length; i++) {
  if (history[i].result === current) {
   streak++;
  } else {
   break;
  }
 }
 
 return {
  current: current,
  length: streak,
  shouldBreak: streak >= 4
 };
}

// Phân tích tần suất
function analyzeFrequency() {
 const recent = history.slice(0, 30);
 const taiCount = recent.filter(h => h.result === 'TÀI').length;
 const xiuCount = recent.length - taiCount;
 
 const ratio = taiCount / (xiuCount || 1);
 
 if (ratio > 1.4) return { shouldBe: 'XỈU' };
 if (ratio < 0.6) return { shouldBe: 'TÀI' };
 
 return { shouldBe: taiCount >= xiuCount ? 'XỈU' : 'TÀI' };
}

// ===== UPDATE DISPLAY =====
function updateDisplay() {
 const { prediction, confidence, dice, sum } = predictNext();
 const predResult = document.getElementById('predResult');
 const predConf = document.getElementById('predConf');
 const predDice = document.getElementById('predDice');
 
 if (prediction === 'TÀI' || prediction === 'XỈU') {
  predResult.textContent = prediction;
  predResult.className = 'pred-main ' + (prediction === 'TÀI' ? 'tai' : 'xiu');
  predConf.textContent = `Độ tin cậy: ${confidence}%`;
  if (dice) {
   predDice.textContent = `Dự đoán XS: ${dice[0]}-${dice[1]}-${dice[2]} (${sum})`;
  }
 } else {
  predResult.textContent = prediction;
  predResult.className = 'pred-main';
  predConf.textContent = '';
  predDice.textContent = '';
 }

 const taiTotal = history.filter(h => h.result === 'TÀI').length;
 const xiuTotal = history.length - taiTotal;
 const accuracy = totalPredictions > 0 ? Math.round((correctPredictions / totalPredictions) * 100) : 0;

 document.getElementById('totalGames').textContent = history.length;
 document.getElementById('taiCount').textContent = taiTotal;
 document.getElementById('xiuCount').textContent = xiuTotal;
 document.getElementById('accuracy').textContent = accuracy + '%';

 const historyList = document.getElementById('historyList');
 if (history.length === 0) {
  historyList.innerHTML = '<div style="text-align:center;color:#555;padding:12px;font-size:10px">Chưa có lịch sử</div>';
 } else {
  historyList.innerHTML = history.slice(0, 20).map((item, index) => `
   <div class="history-item">
    <span class="dice">#${history.length - index}: ${item.dice.join('-')} (${item.sum})</span>
    <span class="${item.result === 'TÀI' ? 'tai' : 'xiu'}">${item.result}</span>
   </div>
  `).join('');
 }
}

// ===== CLEAR HISTORY =====
function clearHistory() {
 if (confirm('Bạn có chắc muốn xóa toàn bộ lịch sử?')) {
  history = [];
  lastPrediction = null;
  lastPredictedDice = null;
  correctPredictions = 0;
  totalPredictions = 0;
  localStorage.removeItem('taixiuHistory');
  localStorage.removeItem('correctPredictions');
  localStorage.removeItem('totalPredictions');
  updateDisplay();
 }
}

// ===== KEYBOARD =====
document.getElementById('d3').addEventListener('keypress', function(e) {
 if (e.key === 'Enter') {
  addResult();
 }
});
</script>
</body>
</html>
